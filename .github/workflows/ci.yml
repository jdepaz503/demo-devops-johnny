name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      DJANGO_SECRET_KEY: clave-solo-para-ci
      DATABASE_NAME: db.sqlite3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt coverage flake8

      - name: Analisis estatico (flake8)
        run: flake8 . --exclude migrations,.venv --max-line-length 120

      - name: Pruebas unitarias con cobertura
        run: |
          coverage run manage.py test
          coverage report
          coverage xml

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
