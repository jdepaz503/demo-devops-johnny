name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      DJANGO_SECRET_KEY: clave-solo-para-ci
      DATABASE_NAME: db.sqlite3
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt coverage flake8

      - name: Analisis estatico (flake8)
        run: flake8 . --exclude migrations,.venv --max-line-length 120

      - name: Pruebas unitarias con cobertura
        run: |
          coverage run manage.py test
          coverage report
          coverage xml

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login en ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata de la imagen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build de la imagen (sin publicar)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: demo-devops-johnny:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Escaneo de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: demo-devops-johnny:scan
          version: v0.69.3
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Push de la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Crear clúster de Kubernetes (kind)
        run: kind create cluster --name demo --wait 120s

      - name: Aplicar manifiestos
        run: |
          IMAGE="${IMAGE_REPO}:sha-${GITHUB_SHA::7}"
          echo "Imagen a desplegar: ${IMAGE}"
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl create secret generic demo-devops-secret \
            --namespace demo-devops \
            --from-literal=DJANGO_SECRET_KEY="$(openssl rand -base64 48)"
          sed "s|image: ghcr.io/.*|image: ${IMAGE}|" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml -f k8s/hpa.yaml -f k8s/ingress.yaml

      - name: Esperar el despliegue
        run: kubectl rollout status deployment/demo-devops --namespace demo-devops --timeout=180s

      - name: Pruebas de humo
        run: |
          kubectl port-forward svc/demo-devops 8080:80 --namespace demo-devops &
          sleep 5
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 2 http://localhost:8080/health/
          echo
          curl --fail --silent --show-error http://localhost:8080/api/users/
          echo

      - name: Estado final del clúster
        if: always()
        run: |
          kubectl get deployment,pods,service,ingress,hpa --namespace demo-devops -o wide
          kubectl logs --namespace demo-devops --selector app.kubernetes.io/name=demo-devops-johnny --tail=20 || true
