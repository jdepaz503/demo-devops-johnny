name: Vigilancia de la API

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-24.04
    steps:
      - name: Consultar la API publica
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --retry 5 --retry-delay 15 --retry-all-errors \
            https://demo-devops-johnny.onrender.com/health/
          echo
