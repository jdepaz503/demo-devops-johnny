{{- if .Values.ingress.enabled }}
{{- $tls := .Values.ingress.tls }}
{{- $useCM := and $tls.enabled $tls.certManager.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "demo-devops.fullname" . }}
  labels:
    {{- include "demo-devops.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations $useCM }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $useCM }}
    {{- if eq $tls.certManager.issuerKind "ClusterIssuer" }}
    cert-manager.io/cluster-issuer: {{ $tls.certManager.issuerName | quote }}
    {{- else }}
    cert-manager.io/issuer: {{ $tls.certManager.issuerName | quote }}
    {{- end }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ $tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "demo-devops.fullname" . }}
                port:
                  name: http
{{- end }}
