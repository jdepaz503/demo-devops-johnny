{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
{{- $name := include "demo-devops.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := .Values.secret.djangoSecretKey }}
{{- if not $key }}
{{- if and $existing $existing.data }}
{{- $key = index $existing.data "DJANGO_SECRET_KEY" | b64dec }}
{{- else }}
{{- $key = randAlphaNum 50 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "demo-devops.labels" . | nindent 4 }}
type: Opaque
stringData:
  DJANGO_SECRET_KEY: {{ $key | quote }}
{{- end }}
