apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-devops
  namespace: demo-devops
  labels:
    app.kubernetes.io/name: demo-devops-johnny
spec:
  ingressClassName: nginx
  rules:
    - host: demo-devops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-devops
                port:
                  name: http
